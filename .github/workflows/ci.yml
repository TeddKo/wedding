name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm -F @wedding/api test
      - run: pnpm -F @wedding/web build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.example.invalid' }}
          PUBLIC_KAKAO_JS_KEY: ${{ vars.PUBLIC_KAKAO_JS_KEY || 'ci-placeholder' }}
          PUBLIC_SNAPSHOTS_CDN: ${{ vars.PUBLIC_SNAPSHOTS_CDN }}
      - run: pnpm audit --audit-level high
