name = "wedding-guestbook"
main = "src/index.ts"
compatibility_date = "2026-10-01"
keep_vars = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "wedding-guestbook"
database_id = "a8374d1d-888d-467a-8401-fd5ceef8b6c7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-snapshots"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

# 로컬 전용(wrangler dev --local). 운영 D1/R2 와 이름이 달라 원격 배포에 사용 금지.
[env.dev]
name = "wedding-guestbook-dev"
vars = { ALLOW_LOCAL = "1" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "wedding-guestbook-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-snapshots-dev"
