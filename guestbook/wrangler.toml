name = "wedding-guestbook"
main = "src/index.ts"
compatibility_date = "2026-10-01"
keep_vars = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "wedding-guestbook"
database_id = "a8374d1d-888d-467a-8401-fd5ceef8b6c7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-snapshots"

[env.dev]
name = "wedding-guestbook-dev"
vars = { ALLOW_LOCAL = "1" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "wedding-guestbook"
database_id = "a8374d1d-888d-467a-8401-fd5ceef8b6c7"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-snapshots"
